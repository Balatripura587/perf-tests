
{{- $MODE := default "Indexed" (or .MODE (env "MODE")) }}
{{- $NODES := int (or .NODES (env "NODES") "3") }}
{{- $NODES_PER_NAMESPACE := min (int (default 100 (or .NODES_PER_NAMESPACE (env "NODES_PER_NAMESPACE")))) $NODES }}
{{- $PODS_PER_NODE := int (default 30 (or .PODS_PER_NODE (env "PODS_PER_NODE"))) }}
{{- $LOAD_TEST_THROUGHPUT := int (default 10 (or .LOAD_TEST_THROUGHPUT (env "LOAD_TEST_THROUGHPUT"))) }}
{{- $jobRunningTime := default "30s" (or .CL2_JOB_RUNNING_TIME (env "CL2_JOB_RUNNING_TIME")) }}

{{- $totalPods := mul $PODS_PER_NODE $NODES }}
{{- $namespaces := div $NODES $NODES_PER_NAMESPACE }}
{{- $podsPerNamespace := div $totalPods $namespaces }}

{{- $smallJobSize := 5 }}
{{- $smallJobsPerNamespace := div $podsPerNamespace (mul 2 $smallJobSize) }}
{{- $mediumJobSize := 20 }}
{{- $mediumJobsPerNamespace := div $podsPerNamespace (mul 4 $mediumJobSize) }}
{{- $largeJobSize := 400 }}
{{- $largeJobsPerNamespace := div $podsPerNamespace (mul 4 $largeJobSize) }}

global:
  measurements:
    - name: jobLatency

metricsEndpoints:
  - endpoint: http://localhost:9090
    indexer:
      type: local

jobs:
  - name: batch-jobs
    jobType: create
    jobIterations: {{ $namespaces }}
    qps: {{ $LOAD_TEST_THROUGHPUT }}
    burst: 1  
    namespace: batch-workload
    namespacedIterations: true
    waitWhenFinished: true 
    maxWaitTimeout: 10m
    verifyObjects: true
    objects:
      # Object 1: Small jobs (replicas = jobs per namespace)
      - objectTemplate: workloads/batch/templates/job-dynamic.yml
        replicas: {{ $smallJobsPerNamespace }}
        inputVars:
          jobSize: {{ $smallJobSize }}
          completionMode: {{ $MODE }}
          sleepDuration: {{ $jobRunningTime }}
          jobType: small

      # Object 2: Medium jobs
      - objectTemplate: workloads/batch/templates/job-dynamic.yml
        replicas: {{ $mediumJobsPerNamespace }}
        inputVars:
          jobSize: {{ $mediumJobSize }}
          completionMode: {{ $MODE }}
          sleepDuration: {{ $jobRunningTime }}
          jobType: medium

{{- if gt $largeJobsPerNamespace 0 }}
      # Object 3: Large jobs
      - objectTemplate: workloads/batch/templates/job-dynamic.yml
        replicas: {{ $largeJobsPerNamespace }}
        inputVars:
          jobSize: {{ $largeJobSize }}
          completionMode: {{ $MODE }}
          sleepDuration: {{ $jobRunningTime }}
          jobType: large
{{- end }}
